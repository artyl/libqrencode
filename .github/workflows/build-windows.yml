name: Build libqrencode (DLL + EXE) on Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSYS2 with dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-make

      - name: Install modern CMake
        uses: lukka/get-cmake@latest

      - name: Configure and Build (DLL + EXE)
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          /c/Program\ Files/CMake/bin/cmake.exe .. -G"MinGW Makefiles" -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          mingw32-make

      - name: Debug file structure
        run: |
          echo ">>> Listing build directory:"
          ls -R build
          echo ">>> Listing root:"
          ls 
        shell: bash

      - name: Upload binaries and headers
        uses: actions/upload-artifact@v4
        with:
          name: qrencode-windows-build
          path: |
            build/qrencode.exe
            build/libqrencode.dll
            build/libqrencode.dll.a
            build/libqrencode.a
            qrencode.h

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            build/qrencode.exe
            build/libqrencode.dll
            build/libqrencode.dll.a
            qrencode.h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
