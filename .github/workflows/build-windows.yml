name: Build libqrencode (DLL + EXE) on Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSYS2 with dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-make

      - name: Install modern CMake
        uses: lukka/get-cmake@latest

      - name: Configure and Build (DLL + EXE)
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          /c/Program\ Files/CMake/bin/cmake.exe .. -G"MinGW Makefiles" -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          mingw32-make

      - name: Upload binaries and headers
        uses: actions/upload-artifact@v4
        with:
          name: qrencode-windows-build
          path: |
            build/bin/qrencode.exe
            build/bin/libqrencode.dll
            build/lib/libqrencode.dll.a
            build/lib/libqrencode.a
            libqrencode/*.h
